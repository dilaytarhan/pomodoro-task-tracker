<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Focus Flow — Pomodoro Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <span class="app-logo">🍅</span>
        <h1 class="app-title">Focus Flow</h1>
      </div>
      <div class="header-right">
        <button class="icon-btn" id="statsToggle" title="Statistics">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        </button>
        <button class="icon-btn" id="themeToggle" title="Toggle theme">
          <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn" id="settingsToggle" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Timer Section -->
    <section class="timer-section">
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="focus">Focus</button>
        <button class="mode-tab" data-mode="short">Short Break</button>
        <button class="mode-tab" data-mode="long">Long Break</button>
      </div>

      <div class="timer-ring-container">
        <svg class="timer-ring" viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="88"/>
          <circle class="ring-progress" cx="100" cy="100" r="88" id="timerRing"/>
        </svg>
        <div class="timer-center">
          <div class="timer-display" id="timerDisplay">25:00</div>
          <div class="timer-label" id="timerLabel">Focus Time</div>
        </div>
      </div>

      <div class="session-dots" id="sessionDots"></div>
      <div class="session-label">Session <span id="sessionCount">1</span> of <span id="sessionTotal">4</span></div>

      <div class="current-task-indicator" id="currentTaskIndicator">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span id="currentTaskName"></span>
      </div>

      <div class="timer-controls">
        <button class="ctrl-btn secondary" id="resetBtn" title="Reset (R)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <button class="ctrl-btn primary" id="startBtn" title="Start / Pause (Space)">
          <svg class="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg class="pause-icon hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        </button>
        <button class="ctrl-btn secondary" id="skipBtn" title="Skip to next">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
      </div>
    </section>

    <!-- Stats Section (collapsible) -->
    <section class="stats-section hidden" id="statsSection">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="statFocusTime">0m</div>
          <div class="stat-label">Focus Today</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statSessions">0</div>
          <div class="stat-label">Sessions</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statStreak">1</div>
          <div class="stat-label">Day Streak</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statTasksDone">0</div>
          <div class="stat-label">Tasks Done</div>
        </div>
      </div>
    </section>

    <!-- Tasks Section -->
    <section class="tasks-section">
      <div class="tasks-header">
        <h2 class="tasks-title">Tasks</h2>
        <div class="task-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="active">Active</button>
          <button class="filter-btn" data-filter="done">Done</button>
        </div>
      </div>

      <div class="task-input-row">
        <select id="prioritySelect" class="priority-select" title="Priority">
          <option value="none">—</option>
          <option value="low">Low</option>
          <option value="medium" selected>Med</option>
          <option value="high">High</option>
        </select>
        <input id="taskInput" class="task-input-field" type="text" placeholder="Add a task… (Enter)" autocomplete="off"/>
        <button class="add-task-btn" id="addTaskBtn" title="Add task">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>

      <div class="task-counter" id="taskCounter">0 / 0 completed</div>

      <ul class="task-list" id="taskList"></ul>

      <div class="task-actions" id="taskActions">
        <button class="text-btn danger" id="clearDoneBtn">Clear completed</button>
      </div>
    </section>

  </div><!-- /.app -->

  <!-- Settings Overlay + Panel -->
  <div class="settings-overlay hidden" id="settingsOverlay"></div>
  <aside class="settings-panel hidden" id="settingsPanel">
    <div class="settings-header">
      <h3>Settings</h3>
      <button class="icon-btn" id="settingsClose">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="settings-body">

      <div class="settings-section">
        <h4>Timer Durations (minutes)</h4>
        <div class="setting-row">
          <label>Focus</label>
          <input type="number" id="sFocusDuration" min="1" max="90" value="25"/>
        </div>
        <div class="setting-row">
          <label>Short Break</label>
          <input type="number" id="sShortBreak" min="1" max="30" value="5"/>
        </div>
        <div class="setting-row">
          <label>Long Break</label>
          <input type="number" id="sLongBreak" min="1" max="60" value="15"/>
        </div>
        <div class="setting-row">
          <label>Sessions before long break</label>
          <input type="number" id="sSessionsBeforeLong" min="2" max="8" value="4"/>
        </div>
      </div>

      <div class="settings-section">
        <h4>Behavior</h4>
        <div class="setting-row">
          <label>Auto-start breaks</label>
          <label class="toggle"><input type="checkbox" id="sAutoBreaks"/><span class="toggle-slider"></span></label>
        </div>
        <div class="setting-row">
          <label>Auto-start focus</label>
          <label class="toggle"><input type="checkbox" id="sAutoFocus"/><span class="toggle-slider"></span></label>
        </div>
        <div class="setting-row">
          <label>Sound alerts</label>
          <label class="toggle"><input type="checkbox" id="sSound" checked/><span class="toggle-slider"></span></label>
        </div>
        <div class="setting-row">
          <label>Browser notifications</label>
          <label class="toggle"><input type="checkbox" id="sNotifications"/><span class="toggle-slider"></span></label>
        </div>
      </div>

      <button class="save-settings-btn" id="saveSettingsBtn">Save Settings</button>

      <div class="settings-section">
        <h4>Data</h4>
        <div class="setting-row">
          <label>Reset today's stats</label>
          <button class="text-btn danger" id="resetStatsBtn">Reset</button>
        </div>
        <div class="setting-row">
          <label>Clear all tasks</label>
          <button class="text-btn danger" id="clearAllTasksBtn">Clear</button>
        </div>
      </div>

    </div>
  </aside>

  <script src="./script.js"></script>
</body>
</html>
